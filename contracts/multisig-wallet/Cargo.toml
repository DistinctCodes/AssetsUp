[package]
name = "multisig-wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Property-based tests for threshold and confirmation invariants ([SC-50]).
proptest = "1"
